name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Builds the site for GitHub Pages, only on pushes to `main` and only once
  # the checks pass. It runs the project's code, so it keeps the read-only
  # token and leaves publishing to the next job.
  pages-build:
    name: Build for Pages
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pages serves the site from a folder named after the repo, so a fork
      # gets the right path without changes.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages has no route fallback, so a screen's URL, such as `/charts`,
      # would get GitHub's 404 page on a first visit. Pages serves `404.html`
      # for any missing path, and as a copy of `index.html` it starts the app,
      # whose router then shows the right screen.
      - name: Add the route fallback
        run: cp dist/index.html dist/404.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Publishes the uploaded site. Only this job can write to Pages.
  pages-deploy:
    name: Deploy to Pages
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Publishes to Pages.
      pages: write
      # Proves to Pages that the request comes from this workflow run.
      id-token: write
    # Records each deployment in the repo's `github-pages` environment, with a
    # link to the site.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time. A newer one waits rather than cancelling one
    # that's partway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Deploys the artifact `pages-build` uploaded. Both actions name it
      # `github-pages` by default, and this one only looks in the current
      # workflow run, so it always gets this run's build.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
